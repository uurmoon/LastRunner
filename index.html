<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Last Runner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:8px}
canvas{width:min(calc(100vw - 16px),177.78vh);height:min(calc((100vw - 16px)/1.7778),calc(100vh - 16px));background:#050505;border-radius:24px;box-shadow:0 40px 120px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.06)}
.hud{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:18px;right:18px;display:flex;gap:12px;align-items:center;justify-content:center;pointer-events:none}
.pill{height:38px;border:1px solid rgba(255,255,255,.13);background:rgba(0,0,0,.38);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 13px;font-size:12px;font-weight:900;letter-spacing:.2em}
.bar{width:210px;height:7px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}.fill{height:100%;width:100%;background:#f2f2f2;border-radius:999px}
#energy .fill{background:#d7f3ff;width:0%}
.controls{position:fixed;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 22px);display:flex;justify-content:space-between;pointer-events:none}
.group{display:flex;gap:14px;pointer-events:auto}.btn{width:82px;height:82px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.38);color:#fff;border-radius:28px;font-size:12px;font-weight:950;letter-spacing:.18em;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 22px 55px rgba(0,0,0,.38)}
.btn:active{transform:scale(.96);background:rgba(255,255,255,.12)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.44);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:24px}
.hidden{display:none!important}.panel{width:min(720px,92vw);border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.55);border-radius:34px;padding:34px;text-align:center;box-shadow:0 40px 120px rgba(0,0,0,.7)}
.k{font-size:12px;letter-spacing:.38em;color:rgba(255,255,255,.55);font-weight:900;text-transform:uppercase}h1{font-size:62px;line-height:.9;margin:12px 0;font-weight:950;letter-spacing:-.06em}.sub{color:rgba(255,255,255,.62);font-size:18px;margin-bottom:26px}.start{height:56px;border:0;border-radius:999px;background:#f2f2f2;color:#050505;padding:0 28px;font-size:13px;font-weight:950;letter-spacing:.22em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.card{text-align:left;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);border-radius:24px;padding:18px;min-height:140px}.card h3{margin:10px 0 8px;font-size:20px}.card p{margin:0;color:rgba(255,255,255,.62);font-size:13px;line-height:1.35}.type{font-size:10px;letter-spacing:.28em;color:rgba(255,255,255,.5);font-weight:900}
.rotate{position:fixed;inset:0;background:#050505;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
@media (orientation:portrait) and (max-width:900px){.rotate{display:flex}#wrap,.hud,.controls,.overlay{visibility:hidden}}
@media(max-width:900px){canvas{border-radius:16px}.pill{height:34px;font-size:9px;padding:0 9px}.bar{width:23vw}.btn{width:70px;height:70px;border-radius:24px;font-size:11px}.cards{grid-template-columns:1fr}h1{font-size:44px}.panel{padding:25px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div class="hud">
  <div class="pill">HP <div class="bar"><div id="hp" class="fill"></div></div><span id="hpv">100</span></div>
  <div id="energy" class="pill">ENERGY <div class="bar"><div id="en" class="fill"></div></div><span id="env">0%</span></div>
  <div class="pill"><span id="dist">0m</span></div>
</div>
<div class="controls"><div class="group"><button id="jump" class="btn">JUMP</button></div><div class="group"><button id="dash" class="btn">DASH</button><button id="shoot" class="btn">SHOOT</button></div></div>
<div id="menu" class="overlay"><div class="panel"><div class="k">Limbo Style Rebuild</div><h1>Last Runner</h1><div class="sub">Run. Shoot. Survive.</div><button id="start" class="start">START RUN</button></div></div>
<div id="up" class="overlay hidden"><div class="panel"><div class="k">Energy Full</div><h1 style="font-size:42px">Choose Upgrade</h1><div id="cards" class="cards"></div></div></div>
<div id="over" class="overlay hidden"><div class="panel"><div class="k">Run Ended</div><h1 style="font-size:52px">Game Over</h1><div id="final" class="sub">0m</div><button id="again" class="start">RESTART</button></div></div>
<div class="rotate"><div class="panel"><h1 style="font-size:34px">Yatay Çevir</h1><div class="sub">Last Runner yatay ekranda oynanır.</div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720,G=555;
let t=0,last=0,paused=true,dead=false,shake=0;
const ui={hp:document.getElementById('hp'),hpv:document.getElementById('hpv'),en:document.getElementById('en'),env:document.getElementById('env'),dist:document.getElementById('dist')};
function newGame(){return{d:0,spd:285,spawn:0,p:{x:170,y:G,vy:0,hp:100,max:100,en:0,jumps:1,jc:0,cd:0,dcd:0,dt:0,rec:0,inv:0,phase:0,dmg:1,fire:300,pet:false},b:[],e:[],it:[],fx:[],gh:[]}}
let g=newGame();
function start(){g=newGame();paused=false;dead=false;last=performance.now();menu.classList.add('hidden');over.classList.add('hidden');up.classList.add('hidden');requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
function tap(id,fn){document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();fn()},{passive:false})}
tap('jump',jump);tap('shoot',shoot);tap('dash',dash);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='KeyK'||e.code==='KeyX')shoot();if(e.code==='ShiftLeft'||e.code==='KeyL')dash()});
function jump(){let p=g.p;if(paused||dead)return;if(p.y>=G-1||p.jc<p.jumps){p.vy=-610;p.jc++;burst(p.x+45,p.y-8,14,.18,3)}}
function shoot(){let p=g.p;if(paused||dead||p.cd>0)return;p.cd=p.fire;p.rec=120;let bx=p.x+103,by=p.y-93;g.b.push({x:bx,y:by,v:780,life:900,d:p.dmg});for(let i=0;i<12;i++)g.fx.push({x:bx,y:by,vx:150+Math.random()*280,vy:(Math.random()-.5)*130,l:150,s:2+Math.random()*4,a:.85});g.fx.push({x:bx+10,y:by,vx:0,vy:0,l:75,s:28,a:.55,flash:1})}
function dash(){let p=g.p;if(paused||dead||p.dcd>0)return;p.dt=160;p.dcd=850;for(let i=0;i<6;i++)g.gh.push({x:p.x-i*18,y:p.y,l:270,a:.18-i*.02});burst(p.x+35,p.y-80,24,.16,4)}
function spawn(){let types=['soldier','robot','creature','mutant'],tier=Math.min(3,Math.floor(g.d/530)),type=types[Math.floor(Math.random()*(tier+1))],s={soldier:[62,135,2,175,12],robot:[72,148,4,150,16],creature:[96,112,3,220,20],mutant:[108,170,6,132,26]}[type];g.e.push({type,x:W+90,y:G,w:s[0],h:s[1],hp:s[2],mx:s[2],spd:s[3],atk:s[4],hit:0,ph:Math.random()*6})}
function upd(dt){if(paused||dead)return;let p=g.p;t+=dt;p.phase+=dt*.012;g.d+=dt*g.spd/1000/3.2;g.spawn-=dt;if(g.spawn<0){spawn();g.spawn=850+Math.random()*780-Math.min(320,g.d*.18)}
p.cd=Math.max(0,p.cd-dt);p.dcd=Math.max(0,p.dcd-dt);p.dt=Math.max(0,p.dt-dt);p.rec=Math.max(0,p.rec-dt);p.inv=Math.max(0,p.inv-dt);p.vy+=1720*dt/1000;p.y+=p.vy*dt/1000;if(p.y>=G){p.y=G;p.vy=0;p.jc=0}
for(let b of g.b){b.x+=b.v*dt/1000;b.life-=dt}g.b=g.b.filter(b=>b.life>0&&b.x<W+80);
for(let e of g.e){e.x-=(e.spd+g.spd*.72)*dt/1000;e.ph+=dt*.006;e.hit=Math.max(0,e.hit-dt);if(hit(p.x+10,p.y-168,74,168,e.x,e.y-e.h,e.w,e.h)&&p.inv<=0){p.hp-=e.atk;p.inv=900;shake=12;burst(p.x+45,p.y-88,22,.32,5);if(p.hp<=0){p.hp=0;end()}}for(let b of g.b){if(b.life>0&&b.x>e.x&&b.x<e.x+e.w&&b.y>e.y-e.h&&b.y<e.y){b.life=0;e.hp-=b.d;e.hit=130;shake=6;burst(b.x,b.y,22,.75,5);if(e.hp<=0){kill(e);e.dead=1;break}}}}g.e=g.e.filter(e=>!e.dead&&e.x>-160);
for(let it of g.it){it.x-=g.spd*.62*dt/1000;it.y+=Math.sin((t+it.seed)*.006)*.25;if(Math.hypot(it.x-(p.x+45),it.y-(p.y-86))<68){p.en=Math.min(100,p.en+it.v);it.dead=1;burst(it.x,it.y,18,.5,4);if(p.en>=100)upgrade()}}g.it=g.it.filter(i=>!i.dead&&i.x>-40);
if(p.pet&&Math.floor(t/650)!==Math.floor((t-dt)/650)){let target=g.e.find(e=>e.x>p.x+120&&e.x<W-40);if(target)g.b.push({x:p.x+55,y:p.y-190,v:675,life:850,d:.7,pet:1})}
for(let f of g.fx){f.x+=f.vx*dt/1000;f.y+=f.vy*dt/1000;f.vy+=220*dt/1000;f.l-=dt}g.fx=g.fx.filter(f=>f.l>0);for(let q of g.gh)q.l-=dt;g.gh=g.gh.filter(q=>q.l>0);uiUpdate()}
function kill(e){for(let i=0;i<4+Math.random()*3;i++)g.it.push({x:e.x+e.w/2+(Math.random()-.5)*35,y:e.y-e.h*.55+(Math.random()-.5)*45,v:8+Math.random()*6,seed:Math.random()*999});burst(e.x+e.w/2,e.y-e.h/2,30,.42,5)}
function upgrade(){paused=true;g.p.en=0;uiUpdate();let opts=[['SKILL','Double Jump','Havada ikinci kez zıpla.',()=>g.p.jumps=2],['WEAPON','Rapid Fire','Tabanca daha hızlı ateş eder.',()=>g.p.fire=Math.max(130,g.p.fire-95)],['PET','Shade Drone','Gölge drone yanında ateş eder.',()=>g.p.pet=true],['SURVIVE','Max HP +25','Can kapasitesi artar.',()=>{g.p.max+=25;g.p.hp=Math.min(g.p.max,g.p.hp+35)}],['WEAPON','Heavy Bullet','Mermi hasarı artar.',()=>g.p.dmg+=.65]].sort(()=>Math.random()-.5).slice(0,3);cards.innerHTML='';opts.forEach(o=>{let el=document.createElement('div');el.className='card';el.innerHTML=`<div class="type">${o[0]}</div><h3>${o[1]}</h3><p>${o[2]}</p>`;el.onclick=()=>{o[3]();up.classList.add('hidden');paused=false;last=performance.now();requestAnimationFrame(loop)};cards.appendChild(el)});up.classList.remove('hidden')}
function end(){dead=true;paused=true;final.textContent=Math.floor(g.d)+'m';over.classList.remove('hidden')}
function hit(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by}
function burst(x,y,n,a,sp){for(let i=0;i<n;i++){let r=Math.random()*Math.PI*2,s=Math.random()*sp*80;g.fx.push({x,y,vx:Math.cos(r)*s,vy:Math.sin(r)*s,l:230+Math.random()*250,s:1.5+Math.random()*4,a})}}
function uiUpdate(){let p=g.p;ui.hp.style.width=p.hp/p.max*100+'%';ui.hpv.textContent=Math.round(p.hp);ui.en.style.width=p.en+'%';ui.env.textContent=Math.round(p.en)+'%';ui.dist.textContent=Math.floor(g.d)+'m'}
function draw(){x.save();x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;world();ghosts();items();bullets();enemies();player();particles();x.restore()}
function world(){let gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#d8d8d8');gr.addColorStop(.18,'#858585');gr.addColorStop(.62,'#242424');gr.addColorStop(1,'#050505');x.fillStyle=gr;x.fillRect(0,0,W,H);x.save();x.globalAlpha=.34;let gl=x.createRadialGradient(625,105,0,625,105,520);gl.addColorStop(0,'rgba(255,255,255,.55)');gl.addColorStop(.36,'rgba(255,255,255,.13)');gl.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gl;x.fillRect(0,-160,W,620);x.restore();layer(.08,305,'rgba(28,28,28,.25)',80);layer(.16,375,'rgba(18,18,18,.42)',120);trees(.25,'rgba(5,5,5,.42)',.55,330);layer(.32,458,'rgba(8,8,8,.72)',145);trees(.55,'rgba(0,0,0,.86)',1,538);x.fillStyle='rgba(0,0,0,.97)';x.beginPath();x.moveTo(0,H);let off=(g.d*46)%160;for(let i=-20;i<=W+20;i+=32)x.lineTo(i,G-10-Math.sin((i+off)*.027)*10-(i%64===0?7:0));x.lineTo(W,H);x.closePath();x.fill();x.strokeStyle='rgba(255,255,255,.07)';x.lineWidth=2;x.beginPath();x.moveTo(0,G-15);x.lineTo(W,G-16);x.stroke();x.strokeStyle='rgba(0,0,0,.98)';x.lineWidth=2;for(let i=0;i<110;i++){let gx=((i*25-(g.d*64)%25)+W)%W,gy=G-6+Math.sin(i)*7;x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+(i%2?8:-8),gy-20-((i*17)%12));x.stroke()}}
function layer(sp,base,col,amp){let off=(g.d*sp)%260;x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let i=-1;i<7;i++){let xx=i*260-off,h=amp*(.45+((i*37)%100)/100);x.quadraticCurveTo(xx+130,base-h,xx+260,base-(amp*.45+((i*53)%80)))}x.lineTo(W,H);x.closePath();x.fill()}
function trees(sp,col,sc,base){let off=(g.d*sp)%360;x.strokeStyle=col;x.lineCap='round';x.lineJoin='round';for(let i=-1;i<6;i++){let tx=i*360-off+70+(i%2)*80,ty=base,s=sc*(.82+(i%3)*.16);x.lineWidth=18*s;x.beginPath();x.moveTo(tx,ty);x.lineTo(tx+12*s,ty-130*s);x.stroke();x.lineWidth=7*s;branch(tx+10*s,ty-95*s,-58*s,-56*s,s);branch(tx+14*s,ty-115*s,72*s,-74*s,s);branch(tx+12*s,ty-75*s,52*s,-35*s,s);branch(tx+8*s,ty-138*s,-34*s,-38*s,s)}}
function branch(a,b,dx,dy,s){x.beginPath();x.moveTo(a,b);x.lineTo(a+dx,b+dy);x.stroke();let old=x.lineWidth;x.lineWidth=Math.max(2,old*.62);x.beginPath();x.moveTo(a+dx*.62,b+dy*.62);x.lineTo(a+dx*.9-18*s,b+dy*.9-25*s);x.stroke();x.lineWidth=old}
function player(){let p=g.p,px=p.x,py=p.y,r=Math.sin(p.phase),bob=py>=G?r*4:0,rec=p.rec>0?10:0;if(p.inv>0&&Math.floor(t/70)%2===0)x.globalAlpha=.55;x.fillStyle='rgba(0,0,0,.65)';x.beginPath();x.ellipse(px+44,py+8,62,12,0,0,Math.PI*2);x.fill();x.fillStyle='#000';x.beginPath();x.moveTo(px+25,py-122+bob);x.quadraticCurveTo(px-26-r*8,py-56,px-4,py-8);x.lineTo(px+42,py-18);x.quadraticCurveTo(px+48,py-72,px+48,py-128+bob);x.closePath();x.fill();x.strokeStyle='#000';x.lineCap='round';x.lineWidth=13;x.beginPath();x.moveTo(px+42,py-43+bob);x.lineTo(px+20+r*18,py-2);x.stroke();x.beginPath();x.moveTo(px+58,py-43+bob);x.lineTo(px+82-r*16,py-2);x.stroke();round(px+22,py-150+bob,56,112,18);x.fill();x.beginPath();x.moveTo(px+22,py-72);x.lineTo(px-2-r*9,py-6);x.lineTo(px+92+r*5,py-6);x.lineTo(px+76,py-72);x.closePath();x.fill();x.fillRect(px+45,py-167+bob,12,22);x.beginPath();x.arc(px+54,py-187+bob,24,0,7);x.fill();x.beginPath();x.ellipse(px+38,py-195+bob,26,20,-.35,0,7);x.fill();x.beginPath();x.ellipse(px+22,py-189+bob,18,13,-.1,0,7);x.fill();x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.arc(px+65,py-189+bob,2.4,0,7);x.fill();x.strokeStyle='#000';x.lineWidth=10;x.beginPath();x.moveTo(px+70,py-118+bob);x.lineTo(px+100-rec,py-101+bob);x.stroke();x.fillStyle='#000';round(px+98-rec,py-108+bob,44,10,4);x.fill();x.fillRect(px+112-rec,py-100+bob,8,18);x.strokeStyle='rgba(255,255,255,.15)';x.lineWidth=2;x.beginPath();x.moveTo(px+76,py-142+bob);x.lineTo(px+84,py-15);x.stroke();if(p.pet){x.fillStyle='#000';x.beginPath();x.ellipse(px+30,py-205+Math.sin(t*.006)*8,22,13,0,0,7);x.fill();x.fillStyle='rgba(255,255,255,.82)';x.beginPath();x.arc(px+40,py-205+Math.sin(t*.006)*8,3,0,7);x.fill()}x.globalAlpha=1}
function enemies(){for(let e of g.e){let ex=e.x,ey=e.y,b=Math.sin(e.ph)*4;x.save();if(e.hit>0){x.shadowBlur=18;x.shadowColor='#fff'}x.fillStyle='#000';x.beginPath();x.ellipse(ex+e.w/2,ey+7,e.w*.55,10,0,0,7);x.fill();if(e.type==='soldier'){x.fillRect(ex+20,ey-e.h+b+42,e.w-26,86);x.beginPath();x.arc(ex+38,ey-e.h+24+b,20,0,7);x.fill();x.fillRect(ex-18,ey-e.h+72+b,44,8);x.fillStyle='rgba(255,255,255,.75)';x.fillRect(ex+48,ey-e.h+24+b,6,3)}else if(e.type==='robot'){round(ex+14,ey-e.h+b+28,e.w-20,100,8);x.fill();x.fillRect(ex+24,ey-e.h+b+4,e.w-40,34);x.fillStyle='rgba(255,255,255,.82)';x.fillRect(ex+38,ey-e.h+18+b,18,3)}else if(e.type==='creature'){x.beginPath();x.ellipse(ex+48,ey-58+b,50,34,0,0,7);x.fill();x.lineWidth=11;x.strokeStyle='#000';x.beginPath();x.moveTo(ex+18,ey-38);x.lineTo(ex-4,ey-3);x.moveTo(ex+68,ey-38);x.lineTo(ex+104,ey-2);x.stroke();x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.arc(ex+61,ey-64+b,3,0,7);x.fill()}else{round(ex+12,ey-e.h+b+18,e.w-20,134,24);x.fill();x.beginPath();x.arc(ex+55,ey-e.h+5+b,30,0,7);x.fill();x.fillStyle='rgba(255,255,255,.8)';x.fillRect(ex+66,ey-e.h+2+b,8,4)}x.fillStyle='rgba(255,255,255,.17)';round(ex,ey-e.h-12,e.w,4,4);x.fill();x.fillStyle='rgba(255,255,255,.82)';round(ex,ey-e.h-12,e.w*(e.hp/e.mx),4,4);x.fill();x.restore()}}
function bullets(){for(let b of g.b){x.strokeStyle=b.pet?'rgba(255,255,255,.55)':'rgba(255,255,255,.88)';x.lineWidth=b.pet?2:3;x.beginPath();x.moveTo(b.x-34,b.y);x.lineTo(b.x+8,b.y);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(b.x+10,b.y,2.8,0,7);x.fill()}}
function items(){for(let it of g.it){x.save();x.translate(it.x,it.y);x.rotate(t*.003+it.seed);x.fillStyle='rgba(255,255,255,.72)';x.shadowBlur=18;x.shadowColor='#fff';x.beginPath();x.moveTo(0,-13);x.lineTo(13,0);x.lineTo(0,13);x.lineTo(-13,0);x.closePath();x.fill();x.restore()}}
function particles(){for(let f of g.fx){x.save();x.globalAlpha=Math.max(0,f.l/300)*f.a;x.fillStyle='#fff';if(f.flash){x.shadowBlur=22;x.shadowColor='#fff'}x.beginPath();x.arc(f.x,f.y,f.s,0,7);x.fill();x.restore()}}
function ghosts(){for(let q of g.gh){x.save();x.globalAlpha=Math.max(0,q.l/270)*q.a;x.fillStyle='#fff';round(q.x+12,q.y-150,58,144,18);x.fill();x.restore()}}
function round(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function loop(ts){let dt=Math.min(34,ts-last||16);last=ts;upd(dt);draw();if(!dead)requestAnimationFrame(loop)}
uiUpdate();draw();
</script>
</body>
</html>
