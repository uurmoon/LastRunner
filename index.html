<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b14">
<title>Last Runner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 45% -10%,rgba(82,220,255,.18),transparent 34%),radial-gradient(circle at 92% 15%,rgba(255,58,90,.12),transparent 30%),linear-gradient(#080b14,#040611);pointer-events:none}#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:8px}canvas{width:min(calc(100vw - 16px),177.78vh);height:min(calc((100vw - 16px)/1.7778),calc(100vh - 16px));background:#070a12;border-radius:24px;box-shadow:0 38px 120px #000b,inset 0 0 0 1px #ffffff12}.hud{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:14px;right:14px;display:flex;justify-content:center;gap:10px;pointer-events:none}.box{height:40px;border:1px solid #ffffff20;background:#07101f99;border-radius:999px;display:flex;align-items:center;gap:9px;padding:0 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:11px;font-weight:950;letter-spacing:.22em}.bar{width:210px;height:8px;background:#ffffff18;border-radius:99px;overflow:hidden}.fill{height:100%;background:#fff;border-radius:99px}.energy{background:linear-gradient(90deg,#effcff,#53dcff,#8d75ff)}.val{font-size:14px;min-width:42px;text-align:right;letter-spacing:.08em}.controls{position:fixed;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 22px);display:flex;justify-content:space-between;pointer-events:none}.grp{display:flex;gap:14px;pointer-events:auto}.btn{width:84px;height:84px;border-radius:28px;border:1px solid #ffffff24;background:#07101f88;color:white;font-size:12px;font-weight:950;letter-spacing:.18em;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 22px 50px #0008}.btn:active{transform:scale(.96);background:#53dcff22}.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#02040a66;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:26px;z-index:10}.hide{display:none!important}.panel{width:min(710px,92vw);padding:34px;text-align:center;border:1px solid #ffffff20;border-radius:34px;background:#07101fb0;box-shadow:0 45px 120px #000b}.k{font-size:12px;letter-spacing:.36em;color:#ffffff88;font-weight:950;text-transform:uppercase}h1{font-size:64px;line-height:.88;margin:14px 0 12px;letter-spacing:-.07em}.sub{font-size:18px;color:#ffffff99;margin-bottom:25px}.primary{height:58px;min-width:210px;border:0;border-radius:999px;background:#f4f7fb;color:#050712;font-weight:950;letter-spacing:.22em}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.card{text-align:left;border:1px solid #ffffff20;background:#ffffff0d;border-radius:24px;padding:18px;min-height:140px}.type{font-size:10px;letter-spacing:.28em;color:#77e8ff;font-weight:950}.card h3{margin:10px 0 8px;font-size:20px}.card p{margin:0;color:#ffffff99;font-size:13px;line-height:1.35}.rot{position:fixed;inset:0;background:#070a12;z-index:40;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}@media(orientation:portrait) and (max-width:900px){.rot{display:flex}.hud,.controls,#wrap,.ov{visibility:hidden}}@media(max-width:900px){canvas{border-radius:16px}.box{height:35px;font-size:9px;padding:0 8px}.bar{width:23vw}.btn{width:70px;height:70px;border-radius:24px;font-size:10px}h1{font-size:44px}.cards{grid-template-columns:1fr}.panel{padding:25px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div class="hud"><div class="box">HP <div class="bar"><div id="hp" class="fill"></div></div><span id="hpv" class="val">100</span></div><div class="box">ENERGY <div class="bar"><div id="en" class="fill energy"></div></div><span id="env" class="val">0%</span></div><div class="box"><span id="score" class="val">0m</span></div></div>
<div class="controls"><div class="grp"><button id="jump" class="btn">JUMP</button></div><div class="grp"><button id="dash" class="btn">DASH</button><button id="shoot" class="btn">SHOOT</button></div></div>
<div id="menu" class="ov"><div class="panel"><div class="k">Sector-01 Prototype</div><h1>Last Runner</h1><div class="sub">Modern 2D action runner. Run. Shoot. Survive.</div><button id="start" class="primary">START RUN</button></div></div>
<div id="upgrade" class="ov hide"><div class="panel"><div class="k">Energy Full</div><h1 style="font-size:42px">Choose Upgrade</h1><div id="cards" class="cards"></div></div></div>
<div id="over" class="ov hide"><div class="panel"><div class="k">Run Ended</div><h1 style="font-size:54px">Game Over</h1><div id="final" class="sub">0m</div><button id="again" class="primary">RESTART</button></div></div>
<div class="rot"><div class="panel"><h1 style="font-size:34px">Yatay Çevir</h1><div class="sub">Last Runner yatay ekranda oynanır.</div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720,G=562;let t=0,last=0,paused=true,dead=false,shake=0;
const hp=document.getElementById('hp'),hpv=document.getElementById('hpv'),en=document.getElementById('en'),env=document.getElementById('env'),score=document.getElementById('score');
const menu=document.getElementById('menu'),up=document.getElementById('upgrade'),cards=document.getElementById('cards'),over=document.getElementById('over'),final=document.getElementById('final');
function base(){return{d:0,spd:315,spawn:0,p:{x:160,y:G,vy:0,vx:0,hp:100,max:100,en:0,jumps:1,jc:0,cd:0,dcd:0,dt:0,rec:0,inv:0,phase:0,fire:250,dmg:1,pet:false},b:[],e:[],it:[],fx:[],gh:[],dust:Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,v:18+Math.random()*28,s:.8+Math.random()*2,a:.04+Math.random()*.08}))}}let g=base();
function start(){g=base();t=0;last=performance.now();paused=false;dead=false;menu.classList.add('hide');up.classList.add('hide');over.classList.add('hide');requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;function bind(id,fn){document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();fn()},{passive:false})}bind('jump',jump);bind('shoot',shoot);bind('dash',dash);addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='KeyK'||e.code==='KeyX')shoot();if(e.code==='ShiftLeft'||e.code==='KeyL')dash()});
function jump(){let p=g.p;if(paused||dead)return;if(p.y>=G-1||p.jc<p.jumps){p.vy=-625;p.jc++;burst(p.x+44,p.y-4,14,'#77e8ff',2.8,.28)}}
function shoot(){let p=g.p;if(paused||dead||p.cd>0)return;p.cd=p.fire;p.rec=130;let bx=p.x+103,by=p.y-93;g.b.push({x:bx,y:by,v:860,life:780,d:p.dmg});flash(bx+12,by,'#fff',28,90);for(let i=0;i<12;i++)fx(bx,by,180+Math.random()*360,(Math.random()-.5)*160,110+Math.random()*100,2+Math.random()*3,'#fff',.82)}
function dash(){let p=g.p;if(paused||dead||p.dcd>0)return;p.dcd=760;p.dt=160;p.vx=900;for(let i=0;i<8;i++)g.gh.push({x:p.x-i*18,y:p.y,life:250,a:.18-i*.018});burst(p.x+38,p.y-82,26,'#77e8ff',4.2,.24)}
function spawn(){let v=[{w:58,h:136,hp:2,spd:190,atk:12},{w:64,h:142,hp:3,spd:170,atk:14},{w:70,h:132,hp:2,spd:220,atk:10}][Math.floor(Math.random()*3)];g.e.push({x:W+80,y:G,w:v.w,h:v.h,hp:v.hp,mx:v.hp,spd:v.spd,atk:v.atk,hit:0,ph:Math.random()*6,shoot:700+Math.random()*900})}
function upd(dt){if(paused||dead)return;let p=g.p;t+=dt;p.phase+=dt*.014;g.d+=dt*g.spd/1000/3.15;g.spawn-=dt;if(g.spawn<=0){spawn();g.spawn=820+Math.random()*640-Math.min(280,g.d*.16)}p.cd=Math.max(0,p.cd-dt);p.dcd=Math.max(0,p.dcd-dt);p.dt=Math.max(0,p.dt-dt);p.rec=Math.max(0,p.rec-dt);p.inv=Math.max(0,p.inv-dt);p.vy+=1760*dt/1000;p.y+=p.vy*dt/1000;p.x+=p.vx*dt/1000;p.vx*=Math.pow(.001,dt/1000);if(p.y>=G){p.y=G;p.vy=0;p.jc=0}for(let b of g.b){b.x+=b.v*dt/1000;b.life-=dt}g.b=g.b.filter(b=>b.life>0&&b.x<W+120&&b.x>-80);for(let e of g.e){e.x-=(e.spd+g.spd*.63)*dt/1000;e.ph+=dt*.006;e.hit=Math.max(0,e.hit-dt);e.shoot-=dt;if(e.shoot<=0&&e.x<W-60&&e.x>p.x+130){e.shoot=1300+Math.random()*800;g.b.push({x:e.x+7,y:e.y-e.h+67,v:-600,life:700,d:1,enemy:true});flash(e.x+6,e.y-e.h+67,'#ff4e66',22,80)}if(rect(p.x+10,p.y-158,72,158,e.x,e.y-e.h,e.w,e.h)&&p.inv<=0)hurt(e.atk);for(let b of g.b){if(!b.enemy&&b.life>0&&b.x>e.x&&b.x<e.x+e.w&&b.y>e.y-e.h&&b.y<e.y){b.life=0;e.hp-=b.d;e.hit=140;shake=Math.max(shake,5);burst(b.x,b.y,18,'#fff',5,.7);if(e.hp<=0){kill(e);e.dead=1;break}}}}g.e=g.e.filter(e=>!e.dead&&e.x>-160);for(let b of g.b)if(b.enemy&&b.life>0&&rect(p.x+10,p.y-158,72,158,b.x-5,b.y-5,10,10)){b.life=0;hurt(10)}for(let it of g.it){it.x-=g.spd*.62*dt/1000;it.y+=Math.sin((t+it.seed)*.006)*.25;if(Math.hypot(it.x-(p.x+45),it.y-(p.y-86))<64){it.dead=1;p.en=Math.min(100,p.en+it.val);burst(it.x,it.y,15,'#77e8ff',3.8,.55);if(p.en>=100)upgrade()}}g.it=g.it.filter(i=>!i.dead&&i.x>-40);if(p.pet&&Math.floor(t/620)!==Math.floor((t-dt)/620)){let target=g.e.find(e=>e.x>p.x+120&&e.x<W-40);if(target)g.b.push({x:p.x+52,y:p.y-186,v:760,life:780,d:.7,pet:true})}for(let f of g.fx){f.x+=f.vx*dt/1000;f.y+=f.vy*dt/1000;f.vy+=120*dt/1000;f.life-=dt}g.fx=g.fx.filter(f=>f.life>0);for(let q of g.gh)q.life-=dt;g.gh=g.gh.filter(q=>q.life>0);for(let m of g.dust){m.x-=m.v*dt/1000;if(m.x<-20){m.x=W+20;m.y=Math.random()*H}}ui()}
function hurt(n){let p=g.p;if(p.inv>0)return;p.hp-=n;p.inv=820;shake=Math.max(shake,11);burst(p.x+48,p.y-88,22,'#ff4e66',4.8,.42);if(p.hp<=0){p.hp=0;dead=true;paused=true;final.textContent=Math.floor(g.d)+'m';over.classList.remove('hide')}}
function kill(e){shake=Math.max(shake,8);burst(e.x+e.w/2,e.y-e.h/2,30,'#fff',5.2,.58);for(let i=0;i<3+Math.random()*3;i++)g.it.push({x:e.x+e.w/2+(Math.random()-.5)*36,y:e.y-e.h*.55+(Math.random()-.5)*44,val:10+Math.random()*7,seed:Math.random()*999})}
function upgrade(){paused=true;g.p.en=0;ui();let opts=[['SKILL','Double Jump','Havada ikinci kez zıpla.',()=>g.p.jumps=2],['WEAPON','Rapid Fire','Atış hızı artar.',()=>g.p.fire=Math.max(120,g.p.fire-70)],['WEAPON','Heavy Bullet','Mermi hasarı artar.',()=>g.p.dmg+=.65],['PET','Mini Drone','Destek drone ateş eder.',()=>g.p.pet=true],['SURVIVE','Max HP +25','Can kapasitesi artar.',()=>{g.p.max+=25;g.p.hp=Math.min(g.p.max,g.p.hp+35)}]].sort(()=>Math.random()-.5).slice(0,3);cards.innerHTML='';opts.forEach(o=>{let el=document.createElement('div');el.className='card';el.innerHTML=`<div class="type">${o[0]}</div><h3>${o[1]}</h3><p>${o[2]}</p>`;el.onclick=()=>{o[3]();up.classList.add('hide');paused=false;last=performance.now();requestAnimationFrame(loop)};cards.appendChild(el)});up.classList.remove('hide')}
function ui(){let p=g.p;hp.style.width=p.hp/p.max*100+'%';hpv.textContent=Math.round(p.hp);en.style.width=p.en+'%';env.textContent=Math.round(p.en)+'%';score.textContent=Math.floor(g.d)+'m'}function rect(a,b,c,d,e,f,h,i){return a<e+h&&a+c>e&&b<f+i&&b+d>f}function fx(x,y,vx,vy,life,size,color,alpha){g.fx.push({x,y,vx,vy,life,size,color,alpha})}function flash(x,y,color,size,life){g.fx.push({x,y,vx:0,vy:0,life,size,color,alpha:.72,flash:1})}function burst(x,y,n,color,spd,alpha){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*spd*80;fx(x,y,Math.cos(a)*s,Math.sin(a)*s,170+Math.random()*260,1.5+Math.random()*4,color,alpha)}}
function draw(){x.save();x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.84;world();ghosts();pickups();bullets();enemies();player();effects();x.restore()}
function world(){let gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#121a2b');gr.addColorStop(.5,'#0a1020');gr.addColorStop(1,'#050712');x.fillStyle=gr;x.fillRect(0,0,W,H);rad(300,150,430,'rgba(119,232,255,.10)');rad(1040,210,360,'rgba(255,78,102,.09)');x.save();for(let m of g.dust){x.globalAlpha=m.a;x.fillStyle='#e9fbff';x.beginPath();x.arc(m.x,m.y,m.s,0,7);x.fill()}x.restore();back(.10,280,'rgba(18,27,43,.62)',0);back(.22,355,'rgba(16,23,39,.78)',1);pipes(.34,420,'rgba(22,31,48,.92)');back(.50,475,'rgba(10,16,29,.98)',2);let floor=x.createLinearGradient(0,G-34,0,H);floor.addColorStop(0,'#20283a');floor.addColorStop(.24,'#121a2b');floor.addColorStop(1,'#050712');x.fillStyle=floor;x.fillRect(0,G-26,W,H-G+26);x.fillStyle='rgba(119,232,255,.13)';x.fillRect(0,G-25,W,2);let off=(g.d*75)%140;x.strokeStyle='rgba(119,232,255,.10)';x.lineWidth=3;for(let q=-140-off;q<W+160;q+=140){x.beginPath();x.moveTo(q,G+55);x.lineTo(q+90,G+55);x.stroke();x.strokeStyle='rgba(255,255,255,.035)';x.beginPath();x.moveTo(q+110,G-22);x.lineTo(q+170,G+124);x.stroke();x.strokeStyle='rgba(119,232,255,.10)'}for(let i=0;i<5;i++){let q=((i*310-(g.d*105)%1550)+1550)%1550-120;x.fillStyle='rgba(5,8,16,.80)';round(q,G-72,70,72,10);x.fill();x.fillStyle=i%2?'rgba(255,78,102,.42)':'rgba(119,232,255,.34)';x.fillRect(q+14,G-58,42,4)}}
function back(sp,base,col,type){let off=(g.d*sp*55)%360;x.save();x.fillStyle=col;for(let i=-2;i<7;i++){let q=i*360-off,w=130+(i%3)*70,h=120+(i%4)*44;round(q,base-h,w,h,10);x.fill();x.fillStyle='rgba(119,232,255,.10)';for(let k=0;k<5;k++)if((k+i+type)%2===0)x.fillRect(q+18+k*22,base-h+22+(k%3)*26,10,4);x.fillStyle=col;if(type>0){x.fillRect(q+w*.55,base-h-36,14,36);x.fillRect(q+w*.55-18,base-h-44,50,9)}}x.restore()}function pipes(sp,base,col){let off=(g.d*sp*55)%420;x.save();x.strokeStyle=col;x.lineWidth=16;x.lineCap='round';for(let i=-1;i<5;i++){let q=i*420-off;x.beginPath();x.moveTo(q,base-70);x.bezierCurveTo(q+80,base-110,q+170,base-30,q+260,base-78);x.stroke();x.beginPath();x.moveTo(q+120,base-10);x.lineTo(q+330,base-10);x.stroke()}x.restore()}
function player(){let p=g.p,q=p.x,y=p.y,r=Math.sin(p.phase),bob=(y>=G-1?r*3:0),rec=p.rec>0?11:0;if(p.inv>0&&Math.floor(t/68)%2===0)x.globalAlpha=.55;x.save();if(p.dt>0){x.globalAlpha=.18;x.fillStyle='#77e8ff';round(q-34,y-146,140,148,38);x.fill();x.globalAlpha=1}x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(q+45,y+8,66,12,0,0,7);x.fill();x.lineCap='round';x.lineWidth=12;x.strokeStyle='#1a2232';x.beginPath();x.moveTo(q+41,y-48+bob);x.lineTo(q+20+r*18,y-7);x.stroke();x.beginPath();x.moveTo(q+58,y-48+bob);x.lineTo(q+80-r*16,y-7);x.stroke();x.lineWidth=7;x.strokeStyle='#c8d3df';x.beginPath();x.moveTo(q+20+r*18,y-7);x.lineTo(q+3+r*18,y-5);x.stroke();x.beginPath();x.moveTo(q+80-r*16,y-7);x.lineTo(q+99-r*16,y-5);x.stroke();let cg=x.createLinearGradient(q,y-160,q+90,y);cg.addColorStop(0,'#f1efe6');cg.addColorStop(.55,'#c4b899');cg.addColorStop(1,'#584b34');x.fillStyle=cg;x.beginPath();x.moveTo(q+24,y-130+bob);x.quadraticCurveTo(q-22-r*10,y-75,q+4,y-8);x.lineTo(q+48,y-17);x.quadraticCurveTo(q+60,y-80,q+55,y-136+bob);x.closePath();x.fill();x.fillStyle='#f4efe4';round(q+22,y-154+bob,58,110,18);x.fill();x.fillStyle='#22293a';round(q+34,y-145+bob,34,86,12);x.fill();x.strokeStyle='#d8b45c';x.lineWidth=3;x.beginPath();x.moveTo(q+27,y-137+bob);x.lineTo(q+72,y-54+bob);x.stroke();x.fillStyle='#d3a17d';round(q+46,y-174+bob,14,24,5);x.fill();x.fillStyle='#e1b087';x.beginPath();x.arc(q+56,y-196+bob,24,0,7);x.fill();x.fillStyle='#12131a';x.beginPath();x.ellipse(q+40,y-205+bob,28,20,-.35,0,7);x.fill();x.beginPath();x.ellipse(q+24,y-198+bob,18,12,0,0,7);x.fill();x.fillStyle='#11131a';x.beginPath();x.arc(q+65,y-198+bob,3,0,7);x.fill();x.strokeStyle='#d0b78b';x.lineWidth=8;x.beginPath();x.moveTo(q+70,y-122+bob);x.lineTo(q+98-rec,y-103+bob);x.stroke();x.fillStyle='#161c28';round(q+96-rec,y-110+bob,48,11,4);x.fill();x.fillRect(q+112-rec,y-101+bob,9,19);if(p.pet){x.fillStyle='#151d2b';x.beginPath();x.ellipse(q+34,y-206+Math.sin(t*.006)*7,24,13,0,0,7);x.fill();x.fillStyle='#77e8ff';x.beginPath();x.arc(q+44,y-206+Math.sin(t*.006)*7,3,0,7);x.fill()}x.restore();x.globalAlpha=1}
function enemies(){for(let e of g.e){let q=e.x,y=e.y,b=Math.sin(e.ph)*3;x.save();if(e.hit>0){x.shadowBlur=18;x.shadowColor='#fff'}x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(q+e.w/2,y+8,e.w*.55,10,0,0,7);x.fill();x.fillStyle='#101623';round(q+17,y-e.h+40+b,e.w-24,88,12);x.fill();x.fillStyle='#202a3d';round(q+20,y-e.h+16+b,38,32,10);x.fill();x.fillStyle='rgba(255,78,102,.85)';x.fillRect(q+43,y-e.h+30+b,10,3);x.strokeStyle='#111724';x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(q+22,y-50+b);x.lineTo(q+4,y-7);x.stroke();x.beginPath();x.moveTo(q+48,y-50+b);x.lineTo(q+68,y-7);x.stroke();x.fillStyle='#070b13';round(q-18,y-e.h+70+b,44,8,3);x.fill();x.fillStyle='rgba(255,255,255,.13)';round(q,y-e.h-13,e.w,5,4);x.fill();x.fillStyle='#ff4e66';round(q,y-e.h-13,e.w*(e.hp/e.mx),5,4);x.fill();x.restore()}}
